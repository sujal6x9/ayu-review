name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "mobile-web/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Android wrapper
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ayu-Review.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ayu-Review-APK
          path: Ayu-Review.apk

      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-build-${{ github.run_number }}"
          Ayu-Review.apk
          --title "Ayu Review Android build ${{ github.run_number }}"
          --notes "Installable Android APK built automatically from commit ${{ github.sha }}."
